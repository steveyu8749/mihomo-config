name: Validate proxy routing configs

on:
  push:
    branches: [main]
    paths:
      - "mihomo/mihomo.yaml"
      - "shadowrocket/shadowrocket.conf"
      - "README.md"
      - "CHANGELOG.md"
      - "docs/**"
      - "rules/**"
      - "scripts/validate_config.py"
      - "scripts/test_validator.py"
      - "scripts/build_shadowrocket_rules.py"
      - "scripts/validate_shadowrocket.py"
      - "scripts/test_shadowrocket_validator.py"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "mihomo/mihomo.yaml"
      - "shadowrocket/shadowrocket.conf"
      - "README.md"
      - "CHANGELOG.md"
      - "docs/**"
      - "rules/**"
      - "scripts/validate_config.py"
      - "scripts/test_validator.py"
      - "scripts/build_shadowrocket_rules.py"
      - "scripts/validate_shadowrocket.py"
      - "scripts/test_shadowrocket_validator.py"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIHOMO_VERSION: v1.19.29

jobs:
  validate:
    name: Validate config
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install policy-validator dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir PyYAML==6.0.3

      - name: Validate Mihomo repository policy
        run: python scripts/validate_config.py mihomo/mihomo.yaml

      - name: Test policy-validator regressions
        run: python scripts/test_validator.py

      - name: Generate and validate Shadowrocket rules
        run: |
          python scripts/build_shadowrocket_rules.py
          python scripts/validate_shadowrocket.py shadowrocket/shadowrocket.conf

      - name: Test Shadowrocket validator regressions
        run: python scripts/test_shadowrocket_validator.py

      - name: Install pinned Mihomo core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          asset="mihomo-linux-amd64-${MIHOMO_VERSION}.gz"
          release_json="${RUNNER_TEMP}/mihomo-release.json"
          archive="${RUNNER_TEMP}/${asset}"
          binary="${RUNNER_TEMP}/mihomo"

          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/MetaCubeX/mihomo/releases/tags/${MIHOMO_VERSION}" \
            > "${release_json}"

          url="$(jq -r --arg name "${asset}" '.assets[] | select(.name == $name) | .browser_download_url' "${release_json}")"
          digest="$(jq -r --arg name "${asset}" '.assets[] | select(.name == $name) | .digest // empty' "${release_json}")"

          if [[ -z "${url}" || "${url}" == "null" ]]; then
            echo "Release asset not found: ${asset}" >&2
            exit 1
          fi
          if [[ "${digest}" != sha256:* ]]; then
            echo "GitHub did not provide a SHA-256 digest for ${asset}" >&2
            exit 1
          fi

          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 \
            "${url}" -o "${archive}"

          printf '%s  %s\n' "${digest#sha256:}" "${archive}" | sha256sum --check --strict
          gzip --decompress --stdout "${archive}" > "${binary}"
          chmod +x "${binary}"
          "${binary}" -v
          echo "MIHOMO_BIN=${binary}" >> "${GITHUB_ENV}"

      - name: Validate with real Mihomo core
        run: |
          set -euo pipefail
          workdir="${RUNNER_TEMP}/proxy-routing-config-test"
          mkdir -p "${workdir}"
          "${MIHOMO_BIN}" convert-ruleset domain text "${GITHUB_WORKSPACE}/rules/Direct.list" "${workdir}/Direct.mrs"
          "${MIHOMO_BIN}" convert-ruleset domain text "${GITHUB_WORKSPACE}/rules/FakeIPFilter.list" "${workdir}/FakeIPFilter.mrs"
          "${MIHOMO_BIN}" convert-ruleset domain text "${GITHUB_WORKSPACE}/rules/ProxyLite.list" "${workdir}/ProxyLite.mrs"
          "${MIHOMO_BIN}" convert-ruleset ipcidr text "${GITHUB_WORKSPACE}/rules/ProxyIP.list" "${workdir}/ProxyIP.mrs"
          timeout 120s "${MIHOMO_BIN}" -t -d "${workdir}" -f "${GITHUB_WORKSPACE}/mihomo/mihomo.yaml"

  publish-mrs:
    name: Publish generated rules
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Install pinned Mihomo core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          asset="mihomo-linux-amd64-${MIHOMO_VERSION}.gz"
          release_json="${RUNNER_TEMP}/mihomo-release.json"
          archive="${RUNNER_TEMP}/${asset}"
          binary="${RUNNER_TEMP}/mihomo"

          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/MetaCubeX/mihomo/releases/tags/${MIHOMO_VERSION}" \
            > "${release_json}"

          url="$(jq -r --arg name "${asset}" '.assets[] | select(.name == $name) | .browser_download_url' "${release_json}")"
          digest="$(jq -r --arg name "${asset}" '.assets[] | select(.name == $name) | .digest // empty' "${release_json}")"

          if [[ -z "${url}" || "${url}" == "null" ]]; then
            echo "Release asset not found: ${asset}" >&2
            exit 1
          fi
          if [[ "${digest}" != sha256:* ]]; then
            echo "GitHub did not provide a SHA-256 digest for ${asset}" >&2
            exit 1
          fi

          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 \
            "${url}" -o "${archive}"

          printf '%s  %s\n' "${digest#sha256:}" "${archive}" | sha256sum --check --strict
          gzip --decompress --stdout "${archive}" > "${binary}"
          chmod +x "${binary}"
          "${binary}" -v
          echo "MIHOMO_BIN=${binary}" >> "${GITHUB_ENV}"

      - name: Generate client rule files
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/mihomo/mrs"
          "${MIHOMO_BIN}" convert-ruleset domain text "${GITHUB_WORKSPACE}/rules/Direct.list" "${GITHUB_WORKSPACE}/mihomo/mrs/Direct.mrs"
          "${MIHOMO_BIN}" convert-ruleset domain text "${GITHUB_WORKSPACE}/rules/FakeIPFilter.list" "${GITHUB_WORKSPACE}/mihomo/mrs/FakeIPFilter.mrs"
          "${MIHOMO_BIN}" convert-ruleset domain text "${GITHUB_WORKSPACE}/rules/ProxyLite.list" "${GITHUB_WORKSPACE}/mihomo/mrs/ProxyLite.mrs"
          "${MIHOMO_BIN}" convert-ruleset ipcidr text "${GITHUB_WORKSPACE}/rules/ProxyIP.list" "${GITHUB_WORKSPACE}/mihomo/mrs/ProxyIP.mrs"
          python scripts/build_shadowrocket_rules.py

      - name: Commit generated rule files
        run: |
          set -euo pipefail
          if git diff --quiet -- mihomo/mrs/ shadowrocket/rules/ && \
             [[ -z "$(git ls-files --others --exclude-standard -- mihomo/mrs/ shadowrocket/rules/)" ]]; then
            echo "Generated rule files are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mihomo/mrs/Direct.mrs mihomo/mrs/FakeIPFilter.mrs mihomo/mrs/ProxyLite.mrs mihomo/mrs/ProxyIP.mrs
          git add shadowrocket/rules/Direct.list shadowrocket/rules/ProxyLite.list shadowrocket/rules/ProxyIP.list
          git commit -m "Update generated client rules"
          git push origin HEAD:main
