name: Validate Mihomo template

on:
  push:
    branches: [main]
    paths:
      - "config.example.yaml"
      - "scripts/validate_config.py"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "config.example.yaml"
      - "scripts/validate_config.py"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin the real client used as the compatibility gate. Update deliberately after
  # reviewing a new stable Mihomo release instead of following "latest" implicitly.
  MIHOMO_VERSION: v1.19.29

jobs:
  validate:
    name: Validate config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install policy-validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Validate repository policy
        run: python scripts/validate_config.py config.example.yaml

      - name: Install pinned Mihomo core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          asset="mihomo-linux-amd64-${MIHOMO_VERSION}.gz"
          release_json="${RUNNER_TEMP}/mihomo-release.json"
          archive="${RUNNER_TEMP}/${asset}"
          binary="${RUNNER_TEMP}/mihomo"

          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/MetaCubeX/mihomo/releases/tags/${MIHOMO_VERSION}" \
            > "${release_json}"

          url="$(jq -r --arg name "${asset}" '.assets[] | select(.name == $name) | .browser_download_url' "${release_json}")"
          digest="$(jq -r --arg name "${asset}" '.assets[] | select(.name == $name) | .digest // empty' "${release_json}")"

          if [[ -z "${url}" || "${url}" == "null" ]]; then
            echo "Release asset not found: ${asset}" >&2
            exit 1
          fi
          if [[ "${digest}" != sha256:* ]]; then
            echo "GitHub did not provide a SHA-256 digest for ${asset}" >&2
            exit 1
          fi

          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 \
            "${url}" -o "${archive}"

          printf '%s  %s\n' "${digest#sha256:}" "${archive}" | sha256sum --check --strict
          gzip --decompress --stdout "${archive}" > "${binary}"
          chmod +x "${binary}"
          "${binary}" -v
          echo "MIHOMO_BIN=${binary}" >> "${GITHUB_ENV}"

      - name: Validate with real Mihomo core
        run: |
          set -euo pipefail
          workdir="${RUNNER_TEMP}/mihomo-config-test"
          mkdir -p "${workdir}"
          timeout 120s "${MIHOMO_BIN}" -t -d "${workdir}" -f "${GITHUB_WORKSPACE}/config.example.yaml"
